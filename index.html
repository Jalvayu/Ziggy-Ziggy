<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive layout -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Ziggy Intelligence | AI-Driven Extreme Weather Anomaly Tracking
    </title>

    <meta
      name="description"
      content="Ziggy Intelligence is an AI-driven platform for tracking extreme weather anomalies across space and time using medium-range forecasts."
    />

    <meta
      name="keywords"
      content="weather anomaly, AI weather, extreme weather, weather forecasting, anomaly detection, Isolation Forest, rainfall, temperature, wind, heat, spatio-temporal tracking"
    />

    <meta name="author" content="Ziggy Intelligence Team" />

    <!-- Theme / browser UI -->
    <meta name="theme-color" content="#08111b" />
    <meta name="color-scheme" content="dark" />

    <!-- Prevent telephone number auto-detection -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / social sharing -->
    <meta
      property="og:title"
      content="Ziggy Intelligence — Extreme Weather Anomaly Tracking"
    />

    <meta
      property="og:description"
      content="AI-driven spatio-temporal tracking of extreme weather anomalies in medium-range forecasts."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:site_name"
      content="Ziggy Intelligence"
    />

    <!-- Twitter / social preview -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Ziggy Intelligence — Extreme Weather Intelligence"
    />

    <meta
      name="twitter:description"
      content="Track temperature, rainfall, wind and heat anomalies using AI-driven weather intelligence."
    />

    <!-- Performance -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apple / mobile -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Preconnect for map resources -->
    <link rel="preconnect" href="https://api.maptiler.com" />
    <link rel="dns-prefetch" href="https://api.maptiler.com" />

    <!-- Accessibility -->
    <meta name="application-name" content="Ziggy Intelligence" />
  </head>

  <body>
    <noscript>
      <strong>
        Ziggy Intelligence requires JavaScript to run.
        Please enable JavaScript in your browser.
      </strong>
    </noscript>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
